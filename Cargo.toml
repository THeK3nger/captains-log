[package]
name = "captains-log"
version = "0.6.0"
edition = "2024"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
rusqlite = { version = "0.41.0", features = ["bundled", "chrono", "functions"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "6.0"
anyhow = "1.0"
colored = "3.0"
pulldown-cmark = "0.13.0"
terminal_size = "0.4.3"
textwrap = { version = "0.16", features = ["unicode-width"] }
rand = "0.10"
which = "8.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
shlex = "2.0.1"
maud = "0.27.0"
serde_yaml_ng = "0.10.0"
ctrlc = "3.5.2"
ureq = "3.5.1"

[[bin]]
name = "cl"
path = "src/main.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
